name: Build FoxyVPN APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify project layout
        shell: bash
        run: |
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing '$f'. The project files must be at the repository ROOT (not inside a FoxyVPN-main subfolder)."
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages and NDK
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          # 'yes' gets SIGPIPE (exit 141) once sdkmanager finishes; with pipefail
          # that would fail the step, so pipefail is turned off for this line.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" > /dev/null
          echo "Installed:"
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|ndk;26.1.10909125"

      - name: Fetch hev-socks5-tunnel native source
        shell: bash
        run: |
          set -eu
          DIR=app/src/main/jni
          if [ -f "$DIR/Android.mk" ] && [ -f "$DIR/third-part/lwip/Android.mk" ] && [ -f "$DIR/third-part/yaml/Android.mk" ] && [ -f "$DIR/third-part/hev-task-system/Android.mk" ] && [ -f "$DIR/src/core/include/hev-socks5.h" ]; then
            echo "Native source already present and complete."
            exit 0
          fi
          rm -rf "$DIR"
          for attempt in 1 2 3; do
            if git clone --branch 2.17.1 --depth 1 --recursive --shallow-submodules \
                 https://github.com/heiher/hev-socks5-tunnel.git "$DIR"; then
              break
            fi
            echo "git clone failed (attempt $attempt), retrying..."
            rm -rf "$DIR"
            sleep 5
          done
          test -f "$DIR/Android.mk" && test -f "$DIR/third-part/lwip/Android.mk" || { echo "::error::hev-socks5-tunnel clone failed"; exit 1; }

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxyVPN-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
