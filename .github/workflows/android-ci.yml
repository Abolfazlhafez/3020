name: Android CI

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages and NDK
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" > /dev/null

      - name: Fetch hev-socks5-tunnel native source
        shell: bash
        run: |
          set -eu
          DIR=app/src/main/jni
          if [ ! -f "$DIR/third-part/lwip/Android.mk" ] || [ ! -f "$DIR/Android.mk" ]; then
            rm -rf "$DIR"
            for attempt in 1 2 3; do
              git clone --branch 2.17.1 --depth 1 --recursive --shallow-submodules \
                https://github.com/heiher/hev-socks5-tunnel.git "$DIR" && break
              rm -rf "$DIR"; sleep 5
            done
          fi
          test -f "$DIR/Android.mk" && test -f "$DIR/third-part/lwip/Android.mk"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foxyvpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages and NDK
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          set -o pipefail
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" > /dev/null

      - name: Fetch hev-socks5-tunnel native source
        shell: bash
        run: |
          set -eu
          DIR=app/src/main/jni
          if [ ! -f "$DIR/third-part/lwip/Android.mk" ] || [ ! -f "$DIR/Android.mk" ]; then
            rm -rf "$DIR"
            for attempt in 1 2 3; do
              git clone --branch 2.17.1 --depth 1 --recursive --shallow-submodules \
                https://github.com/heiher/hev-socks5-tunnel.git "$DIR" && break
              rm -rf "$DIR"; sleep 5
            done
          fi
          test -f "$DIR/Android.mk" && test -f "$DIR/third-part/lwip/Android.mk"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode signing keystore
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -eu
          # app/build.gradle.kts silently falls back to the DEBUG key when any
          # signing input is missing, so a tagged release must refuse to run.
          for v in SIGNING_KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_STORE_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set. Refusing to publish a release APK that would be signed with the debug key."
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify release APK is not debug-signed
        run: |
          set -eu
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/35.0.0/apksigner)"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [ "${#apks[@]}" -gt 0 ] || { echo "::error::No release APK was produced"; exit 1; }
          for apk in "${apks[@]}"; do
            "$APKSIGNER" verify --print-certs "$apk" | tee /tmp/certs.txt
            if grep -qi "Android Debug" /tmp/certs.txt; then
              echo "::error::$apk is signed with the Android debug certificate"
              exit 1
            fi
          done

      - name: Remove the decoded keystore
        if: always()
        run: rm -f release-keystore.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
